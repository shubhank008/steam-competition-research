[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "steam-competition-research"
version = "0.1.0"
description = "Evidence-backed Steam competitor research CLI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "curl-cffi>=0.9.0,<1",
    "typer>=0.16.0,<1",
]

[project.scripts]
steam-research = "steam_research.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.15.0,<2",
    "pytest>=8.3.0,<9",
    "ruff>=0.11.0,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/steam_research"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
